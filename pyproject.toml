[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-ladder"
version = "0.1.0"
description = "An inference-optimization ladder for a small language model: one technique per rung, every step measured."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "José Miguel Luís Antunes" }]
dependencies = [
    "torch>=2.2",
    "transformers>=5.0",
    "numpy>=1.26",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Real evaluation data (WikiText-2). Not needed for the unit tests.
data = ["datasets>=2.19"]
# Rungs 02-05: ONNX export, graph optimization, quantization.
onnx = ["optimum[onnxruntime]>=1.21", "onnx>=1.16", "onnxruntime>=1.18"]
# Rung 06: the HTTP service.
serve = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2.7"]
# Load testing for the service.
load = ["locust>=2.29"]
# Charts for the README.
report = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
ladder = "ladder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs a real model download or a long run (deselected in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
